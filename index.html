<style>
  :root{
    --ink:#16233B; --paper:#F6F5F1; --blue:#2E6FF2; --slate:#5B6B82;

  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'IBM Plex Sans',sans-serif;color:var(--ink);}

  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;}

  .section-header{display:flex;align-items:center;gap:10px;margin:26px 0 14px;border-bottom:1px solid var(--border);padding-bottom:8px;}

function projFinance(p){
  const negociado = Number(p.valorNegociado)||0;
  const parcelas = p.parcelas||[];
  const recebido = parcelas.filter(x=>x.pago).reduce((s,x)=>s+(Number(x.valor)||0),0);
  const aReceber = Math.max(negociado-recebido,0);
  const ultimaPaga = parcelas.filter(x=>x.pago && x.dataPaga).sort((a,b)=>String(a.dataPaga).localeCompare(String(b.dataPaga))).pop();
  return { negociado, recebido, aReceber, ultimaPaga };
}

/* ============================== API (Google Sheets via Apps Script, sem CORS) ============================== */
function bridgeGet(url, extraQuery){
  return new Promise((resolve, reject) => {
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    let settled = false;
    const onMsg = (event) => {
      if(!event.data || !event.data.__appBridge) return;
      if(settled) return;
      settled = true;
      cleanup();
      resolve(event.data.data);
    };
    const cleanup = () => { window.removeEventListener('message', onMsg); clearTimeout(timer); setTimeout(()=>iframe.remove(),50); };
    window.addEventListener('message', onMsg);
    const timer = setTimeout(() => {
      if(settled) return; settled = true; cleanup();
      reject(new Error('Não consegui conectar. Confira se a URL está correta e termina em /exec.'));
    }, 15000);
    const sep = url.includes('?') ? '&' : '?';
    iframe.src = url + sep + 'bridge=1' + (extraQuery || '');
    document.body.appendChild(iframe);
  });
}
function formPost(url, payloadObj){
  return new Promise((resolve) => {
    const iframeName = 'frame_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const iframe = document.createElement('iframe');
    iframe.name = iframeName;
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = url;
    form.target = iframeName;
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'payload';
    input.value = JSON.stringify(payloadObj);
    form.appendChild(input);
    document.body.appendChild(form);

    let done = false;
    const finish = () => {
      if(done) return; done = true;
      setTimeout(() => { form.remove(); iframe.remove(); }, 200);
      resolve({ ok: true });
    };
    iframe.addEventListener('load', finish);
    setTimeout(finish, 8000); // rede muito lenta: segue em frente e confia no próximo recarregamento
    form.submit();
  });
}

/* ============================== SMALL UI HELPERS ============================== */
function Badge({status}){
  const color = STATUS_COLOR[status]||SLATE;
  return html`<span class="badge" style=${{background:color+"1A",color:color,border:`1px solid ${color}40`}}>
    <span style=${{width:6,height:6,borderRadius:"50%",background:color}}></span>${status}
  </span>`;
}
function Field({label, children}){ return html`<div style=${{marginBottom:14}}><label class="label">${label}</label>${children}</div>`; }
function SectionHeader({n,title}){
  return html`<div class="section-header">
    <span class="mono" style=${{fontSize:12,color:BLUE,fontWeight:600}}>${n}</span>
    <span class="mono" style=${{fontSize:12,letterSpacing:"0.1em",textTransform:"uppercase",color:INK,fontWeight:600}}>${title}</span>
  </div>`;
}
function KpiCard({label, value, sub, accent}){
  return html`<div class="card" style=${{padding:"16px 18px",position:"relative",overflow:"hidden"}}>
    <div style=${{position:"absolute",top:0,left:0,width:4,height:"100%",background:accent||BLUE}}></div>
    <span class="label">${label}</span>
    <div class="mono" style=${{fontSize:24,fontWeight:600,color:INK,marginTop:2}}>${value}</div>
    ${sub && html`<div style=${{fontSize:12,color:SLATE,marginTop:4}}>${sub}</div>`}
  </div>`;
}
function ChartCard({title, children}){
  return html`<div class="card" style=${{padding:16}}>
    <div class="mono" style=${{fontSize:12,letterSpacing:"0.06em",textTransform:"uppercase",color:SLATE,marginBottom:10}}>${title}</div>
    ${children}
  </div>`;
}
function Empty(){ return html`<div style=${{height:240,display:"flex",alignItems:"center",justifyContent:"center",color:SLATE,fontSize:13}}>Sem dados suficientes para este filtro.</div>`; }

function Canvas({type, data, options, height}){
  const ref = useRef(null);
  useEffect(() => {
    if(!ref.current) return;
    const chart = new Chart(ref.current.getContext('2d'), {type, data, options: options||{}});
    return () => chart.destroy();
  }, [JSON.stringify(data), type]);
  return html`<canvas ref=${ref} height=${height||240}></canvas>`;
}

/* ============================== LOGIN ============================== */
function Login({onSuccess}){
  const [email, setEmail] = useState("");
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const submit = () => {
    const okEmail = AUTH.allowedEmails.map(e=>e.toLowerCase().trim()).includes(email.toLowerCase().trim());
    const okPwd = pwd === AUTH.password;
    if(okEmail && okPwd){
      localStorage.setItem('auth-v1', JSON.stringify({email, ts:Date.now()}));
      onSuccess(email);
    } else {
      setErr("E-mail ou senha incorretos.");
    }
  };
  return html`<div style=${{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER}}>
    <div class="card" style=${{width:"min(380px,92vw)",padding:28}}>
      <div class="label">Gestão de Projetos</div>
      <h2 style=${{margin:"4px 0 20px",fontSize:19}}>Entrar</h2>
      <${Field} label="E-mail"><input class="input" type="email" value=${email} onInput=${e=>setEmail(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&submit()} /><//>
      <${Field} label="Senha"><input class="input" type="password" value=${pwd} onInput=${e=>setPwd(e.target.value)} onKeyDown=${e=>e.key==='Enter'&&submit()} /><//>
      ${err && html`<div style=${{color:TERRA,fontSize:13,marginBottom:12}}>${err}</div>`}
      <button class="btn btn-primary" style=${{width:"100%",justifyContent:"center"}} onClick=${submit}>Entrar</button>
    </div>
  </div>`;
}

/* ============================== SETUP (URL do backend) ============================== */
function Setup({onSaved}){
  const [url, setUrl] = useState("");
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState("");
  const save = async () => {
    if(!url.trim()){ setErr("Cole a URL do Apps Script."); return; }
    setTesting(true); setErr("");
    localStorage.setItem('apiUrl', url.trim());
    try {
      await api.getAll();
      onSaved();
    } catch(e){
      setErr("Não consegui conectar: " + e.message);
      localStorage.removeItem('apiUrl');
    } finally { setTesting(false); }
  };
  return html`<div style=${{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:PAPER,padding:20}}>
    <div class="card" style=${{width:"min(480px,92vw)",padding:28}}>
      <div class="label">Configuração inicial</div>
      <h2 style=${{margin:"4px 0 12px",fontSize:19}}>Conectar à planilha</h2>
      <p style=${{fontSize:13,color:SLATE,lineHeight:1.6}}>Cole abaixo a URL do Apps Script (Web App) publicada a partir da sua Google Planilha. Isso só precisa ser feito uma vez por navegador.</p>
      <${Field} label="URL do Web App">
        <input class="input" value=${url} onInput=${e=>setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/.../exec" />
      <//>
      ${err && html`<div style=${{color:TERRA,fontSize:13,marginBottom:12}}>${err}</div>`}
      <button class="btn btn-primary" style=${{width:"100%",justifyContent:"center"}} onClick=${save} disabled=${testing}>${testing?"Testando conexão...":"Salvar e conectar"}</button>
    </div>
  </div>`;
}

    filtered.forEach(p => {
      const fin = projFinance(p);
      negociado+=fin.negociado; recebido+=fin.recebido; aReceber+=fin.aReceber;
      if(p.dataInicio && p.dataFinalizacao){ const d=daysBetween(p.dataInicio,p.dataFinalizacao); if(d!==null){slaESum+=d; slaEN++;} }
      if(p.dataFinalizacao && fin.ultimaPaga){ const d=daysBetween(p.dataFinalizacao, fin.ultimaPaga.dataPaga); if(d!==null){slaPSum+=d; slaPN++;} }
      const mk = monthKey(p.dataInicio); if(mk) porMesQtd[mk]=(porMesQtd[mk]||0)+1;
      (p.parcelas||[]).forEach(pc => { if(pc.pago && pc.dataPaga){ const mk2=monthKey(pc.dataPaga); if(mk2) porMesValor[mk2]=(porMesValor[mk2]||0)+(Number(pc.valor)||0); } });
      if(p.cliente){ porClienteQtd[p.cliente]=(porClienteQtd[p.cliente]||0)+1; porClienteValor[p.cliente]=(porClienteValor[p.cliente]||0)+fin.negociado; }
    });
    const sortObj = o => Object.entries(o).sort((a,b)=>a[0].localeCompare(b[0]));
    const mesesQtd = sortObj(porMesQtd).map(([k,v])=>({mes:monthLabel(k),qtd:v}));
    const mesesValor = sortObj(porMesValor).map(([k,v])=>({mes:monthLabel(k),valor:v}));
    const topN = (o,n=6) => { const arr=Object.entries(o).sort((a,b)=>b[1]-a[1]); const top=arr.slice(0,n); const rest=arr.slice(n).reduce((s,[,v])=>s+v,0); const out=top.map(([name,value])=>({name,value})); if(rest>0) out.push({name:"Outros",value:rest}); return out; };
    return { negociado, recebido, aReceber, slaEntrega: slaEN?Math.round(slaESum/slaEN):null, slaPagamento: slaPN?Math.round(slaPSum/slaPN):null, mesesQtd, mesesValor, pizzaQtd:topN(porClienteQtd), pizzaValor:topN(porClienteValor), total:filtered.length };
  }, [filtered]);

  return html`<div>
    <div class="card" style=${{display:"flex",flexWrap:"wrap",gap:12,alignItems:"flex-end",padding:16,marginBottom:20}}>
      <div style=${{minWidth:200}}>
        <label class="label">Cliente</label>
        <select class="input" value=${filtroCliente} onChange=${e=>setFiltroCliente(e.target.value)}>
          <option value="">Todos os clientes</option>
          ${clientes.map(c => html`<option key=${c.id} value=${c.nome}>${c.nome}</option>`)}
        </select>
      </div>
      <div><label class="label">Início de</label><input class="input" type="date" value=${dataDe} onInput=${e=>setDataDe(e.target.value)} /></div>
      <div><label class="label">Início até</label><input class="input" type="date" value=${dataAte} onInput=${e=>setDataAte(e.target.value)} /></div>
      ${(filtroCliente||dataDe||dataAte) && html`<button class="btn btn-ghost" onClick=${()=>{setFiltroCliente("");setDataDe("");setDataAte("");}}>Limpar</button>`}
      <div style=${{marginLeft:"auto",fontSize:12,color:SLATE}} class="mono">${m.total} projeto(s) no filtro</div>
    </div>

    <div style=${{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(210px, 1fr))",gap:14,marginBottom:22}}>
      <${KpiCard} label="Total recebido" value=${currency(m.recebido)} accent=${TEAL} />
      <${KpiCard} label="Falta receber" value=${currency(m.aReceber)} accent=${AMBER} sub=${`de ${currency(m.negociado)} negociado`} />
      <${KpiCard} label="SLA médio de entrega" value=${m.slaEntrega!==null?`${m.slaEntrega} dias`:"—"} accent=${BLUE} sub="início → finalização" />
      <${KpiCard} label="SLA médio de pagamento" value=${m.slaPagamento!==null?`${m.slaPagamento} dias`:"—"} accent="#7C5CBF" sub="finalização → últ. pagamento" />
    </div>

    <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
      <${ChartCard} title="Serviços executados / mês">
        ${m.mesesQtd.length ? html`<${Canvas} type="bar" height=240 data=${{labels:m.mesesQtd.map(x=>x.mes), datasets:[{label:"Projetos", data:m.mesesQtd.map(x=>x.qtd), backgroundColor:BLUE, borderRadius:4}]}} options=${{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true,ticks:{precision:0}}}}} />` : html`<${Empty}/>`}
      <//>
      <${ChartCard} title="Valores recebidos / mês">
        ${m.mesesValor.length ? html`<${Canvas} type="line" height=240 data=${{labels:m.mesesValor.map(x=>x.mes), datasets:[{label:"Recebido", data:m.mesesValor.map(x=>x.valor), borderColor:TEAL, backgroundColor:TEAL, tension:0.3}]}} options=${{plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>currency(c.raw)}}}, scales:{y:{ticks:{callback:v=>(v/1000)+"k"}}}}} />` : html`<${Empty}/>`}
      <//>
    </div>

    <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <${ChartCard} title="Clientes que mais enviam projetos">
        ${m.pizzaQtd.length ? html`<${Canvas} type="pie" height=260 data=${{labels:m.pizzaQtd.map(x=>x.name), datasets:[{data:m.pizzaQtd.map(x=>x.value), backgroundColor:PIE_COLORS}]}} />` : html`<${Empty}/>`}
      <//>
      <${ChartCard} title="Clientes por faturamento">
        ${m.pizzaValor.length ? html`<${Canvas} type="pie" height=260 data=${{labels:m.pizzaValor.map(x=>x.name), datasets:[{data:m.pizzaValor.map(x=>x.value), backgroundColor:PIE_COLORS}]}} options=${{plugins:{tooltip:{callbacks:{label:c=>c.label+": "+currency(c.raw)}}}}} />` : html`<${Empty}/>`}
      <//>
    </div>
  </div>`;
}

function ProjectModal({initial, clientes, busy, onClose, onSave}){
  const [form, setForm] = useState(initial.id ? {...initial} : {...initial, id:null});
  const set = (k,v) => setForm(prev => ({...prev, [k]:v}));
  const negociado = Number(form.valorNegociado)||0;
  const somaParcelas = (form.parcelas||[]).reduce((s,x)=>s+(Number(x.valor)||0),0);
  const diff = Math.round((negociado-somaParcelas)*100)/100;

  const regenerateParcelas = n => {
    n = Math.max(1, parseInt(n)||1);
    const val = negociado ? Math.round((negociado/n)*100)/100 : 0;
    set("parcelas", Array.from({length:n},(_,i)=>newParcela(i+1,val)));
  };
  const updateParcela = (id,patch) => set("parcelas", form.parcelas.map(p=>p.id===id?{...p,...patch}:p));
  const addParcela = () => { const next=(form.parcelas.length?Math.max(...form.parcelas.map(p=>p.numero)):0)+1; set("parcelas",[...form.parcelas,newParcela(next)]); };
  const removeParcela = id => set("parcelas", form.parcelas.filter(p=>p.id!==id));
  const updateFase = (id,patch) => set("fases", form.fases.map(f=>f.id===id?{...f,...patch}:f));
  const addFase = () => set("fases", [...form.fases, newFase(form.fases.length+1)]);
  const removeFase = id => set("fases", form.fases.filter(f=>f.id!==id));

  const canSubmit = form.cliente.trim() && form.nomeProjeto.trim();
  const submit = () => { if(canSubmit) onSave({...form, id: form.id||uid()}); };

  return html`<div class="modal-overlay" onClick=${onClose}>
    <div class="modal-panel" onClick=${e=>e.stopPropagation()}>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <h2 style=${{margin:0,fontSize:19}}>${form.id?"Editar projeto":"Novo projeto"}</h2>
        <button class="icon-btn" onClick=${onClose}>✕</button>
      </div>

      <${SectionHeader} n="01" title="Identificação" />
      <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <${Field} label="Cliente *"><input class="input" list="clientes-list" value=${form.cliente} onInput=${e=>set("cliente",e.target.value)} /><datalist id="clientes-list">${clientes.map(c=>html`<option key=${c.id} value=${c.nome} />`)}</datalist><//>
        <${Field} label="Indicação"><input class="input" value=${form.indicacao} onInput=${e=>set("indicacao",e.target.value)} /><//>
        <${Field} label="Especialidade"><input class="input" value=${form.especialidade} onInput=${e=>set("especialidade",e.target.value)} /><//>
        <${Field} label="Tipo de projeto"><input class="input" value=${form.tipoProjeto} onInput=${e=>set("tipoProjeto",e.target.value)} /><//>
        <${Field} label="Nome do projeto *"><input class="input" value=${form.nomeProjeto} onInput=${e=>set("nomeProjeto",e.target.value)} /><//>
        <${Field} label="Status">
          <select class="input" value=${form.status} onChange=${e=>set("status",e.target.value)}>${STATUS_OPTIONS.map(s=>html`<option key=${s} value=${s}>${s}</option>`)}</select>
        <//>
      </div>

      <${SectionHeader} n="02" title="Financeiro" />
      <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <${Field} label="Valor negociado (R$)"><input class="input" type="number" step="0.01" value=${form.valorNegociado} onInput=${e=>set("valorNegociado",e.target.value)} /><//>
        <${Field} label="Forma de pagamento">
          <select class="input" value=${form.formaPagamento} onChange=${e=>set("formaPagamento",e.target.value)}>${FORMAS_PAGAMENTO.map(f=>html`<option key=${f} value=${f}>${f}</option>`)}</select>
        <//>
      </div>
      <${Field} label="Quantas parcelas?">
        <div style=${{display:"flex",gap:10,alignItems:"center"}}>
          <input class="input" type="number" min="1" style=${{maxWidth:100}} value=${form.parcelas.length} onInput=${e=>regenerateParcelas(e.target.value)} />
          <span style=${{fontSize:12,color:SLATE}}>define a quantidade e divide o valor — ajuste cada parcela abaixo</span>
        </div>
      <//>
      <div style=${{border:"1px solid "+BORDER,borderRadius:8,overflow:"hidden",marginBottom:6}}>
        ${form.parcelas.map((pc,idx) => html`<div key=${pc.id} style=${{display:"grid",gridTemplateColumns:"36px 1fr 1fr 1fr 90px 34px",gap:8,alignItems:"center",padding:"8px 10px",borderBottom: idx<form.parcelas.length-1?"1px solid "+BORDER:"none",background: idx%2?PAPER:"#fff"}}>
          <span class="mono" style=${{fontSize:12,color:SLATE}}>#${pc.numero}</span>
          <input class="input" type="number" step="0.01" value=${pc.valor} onInput=${e=>updateParcela(pc.id,{valor:e.target.value})} />
          <input class="input" type="date" value=${pc.dataPrevista} onInput=${e=>updateParcela(pc.id,{dataPrevista:e.target.value})} />
          <input class="input" type="date" value=${pc.dataPaga} onInput=${e=>updateParcela(pc.id,{dataPaga:e.target.value, pago: !!e.target.value})} />
          <label style=${{display:"flex",alignItems:"center",gap:5,fontSize:12,color:pc.pago?TEAL:SLATE}}><input type="checkbox" checked=${pc.pago} onChange=${e=>updateParcela(pc.id,{pago:e.target.checked})} /> Pago</label>
          <button class="icon-btn" style=${{color:TERRA}} onClick=${()=>removeParcela(pc.id)}>🗑</button>
        </div>`)}
      </div>
      <div style=${{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
        <button class="btn btn-ghost" onClick=${addParcela}>+ Adicionar parcela</button>
        ${negociado>0 && Math.abs(diff)>0.01 && html`<span style=${{fontSize:12,color:TERRA}}>⚠ diferença de ${currency(diff)} vs. valor negociado</span>`}
      </div>

      <${SectionHeader} n="03" title="Cronograma" />
      <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
        <${Field} label="Data de início"><input class="input" type="date" value=${form.dataInicio} onInput=${e=>set("dataInicio",e.target.value)} /><//>
        <${Field} label="Data de finalização"><input class="input" type="date" value=${form.dataFinalizacao} onInput=${e=>set("dataFinalizacao",e.target.value)} /><//>
      </div>
      <${Field} label=${`Fases de entrega (${form.fases.length})`}>
        <div style=${{border:"1px solid "+BORDER,borderRadius:8,overflow:"hidden"}}>
          ${form.fases.map((f,idx) => html`<div key=${f.id} style=${{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 34px",gap:8,alignItems:"center",padding:"8px 10px",borderBottom: idx<form.fases.length-1?"1px solid "+BORDER:"none",background: idx%2?PAPER:"#fff"}}>
            <input class="input" value=${f.nome} onInput=${e=>updateFase(f.id,{nome:e.target.value})} />
            <input class="input" type="date" value=${f.dataPrevista} onInput=${e=>updateFase(f.id,{dataPrevista:e.target.value})} />
            <input class="input" type="date" value=${f.dataReal} onInput=${e=>updateFase(f.id,{dataReal:e.target.value})} />
            <button class="icon-btn" style=${{color:TERRA}} onClick=${()=>removeFase(f.id)}>🗑</button>
          </div>`)}
        </div>
        <button class="btn btn-ghost" style=${{marginTop:8}} onClick=${addFase}>+ Adicionar fase</button>
      <//>

      <${SectionHeader} n="04" title="Observações" />
      <${Field} label="Notas gerais"><textarea class="input" rows="4" value=${form.observacoes} onInput=${e=>set("observacoes",e.target.value)} style=${{resize:"vertical"}}></textarea><//>

      <div style=${{borderTop:"1px solid "+BORDER,padding:"14px 0",marginTop:20,display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button class="btn btn-ghost" onClick=${onClose}>Cancelar</button>
        <button class="btn btn-primary" style=${!canSubmit||busy?{opacity:0.5,cursor:"not-allowed"}:{}} onClick=${submit}>${busy?"Salvando...":"Salvar projeto"}</button>
      </div>
    </div>
  </div>`;
}

      <${Field} label="Envio de serviços">
        <div style=${{display:"flex",gap:10}}>
          ${TIPO_ENVIO.map(t => html`<button key=${t} onClick=${()=>set("tipoEnvio",t)} style=${{flex:1,padding:10,borderRadius:7,cursor:"pointer",border:"1px solid "+(form.tipoEnvio===t?BLUE:BORDER),background:form.tipoEnvio===t?BLUE+"12":"#fff",color:form.tipoEnvio===t?BLUE:SLATE,fontWeight:600,fontSize:13}}>${t}</button>`)}
        </div>
      <//>
      <${Field} label="Observações"><textarea class="input" rows="4" value=${form.observacoes} onInput=${e=>set("observacoes",e.target.value)} style=${{resize:"vertical"}}></textarea><//>
      <div style=${{display:"flex",gap:10,justifyContent:"flex-end",marginTop:20,borderTop:"1px solid "+BORDER,paddingTop:14}}>
        <button class="btn btn-ghost" onClick=${onClose}>Cancelar</button>
        <button class="btn btn-primary" style=${!canSubmit||busy?{opacity:0.5}:{}} onClick=${()=>canSubmit && onSave({...form, id: form.id||uid()})}>${busy?"Salvando...":"Salvar cliente"}</button>
      </div>
    </div>
  </div>`;
}

/* ============================== APP ============================== */
function AppMain({email, onLogout}){
  const [tab, setTab] = useState("dashboard");
  const [projetos, setProjetos] = useState([]);
  const [clientes, setClientes] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [canSeed, setCanSeed] = useState(false);

  const reload = async () => {
    try {
      const data = await api.getAll();
      setProjetos(data.projetos||[]);
      setClientes(data.clientes||[]);
      setCanSeed((data.projetos||[]).length === 0);
      setError("");
    } catch(e){ setError(e.message); }
    finally { setLoaded(true); }
  };
  useEffect(() => { reload(); }, []);

  const upsertProjeto = async p => {
    setBusy(true);
    try { await api.saveProjeto(p); await reload(); }
    catch(e){ setError(e.message); }
    finally { setBusy(false); }
  };
  const deleteProjeto = async id => {
    setBusy(true);
    try { await api.deleteProjeto(id); await reload(); }
    catch(e){ setError(e.message); }
    finally { setBusy(false); }
  };
  const upsertCliente = async c => {
    setBusy(true);
    try { await api.saveCliente(c); await reload(); }
    catch(e){ setError(e.message); }
    finally { setBusy(false); }
  };
  const deleteCliente = async id => {
    setBusy(true);
    try { await api.deleteCliente(id); await reload(); }
    catch(e){ setError(e.message); }
    finally { setBusy(false); }
  };
  const runSeed = async () => {
    setBusy(true);
    try { await api.seed(SEED_PROJETOS, SEED_CLIENTES); await reload(); }
    catch(e){ setError(e.message); }
    finally { setBusy(false); }
  };

  const TABS = [ {id:"dashboard",label:"Indicadores"}, {id:"projetos",label:"Projetos"}, {id:"clientes",label:"Clientes"} ];

  return html`<div style=${{minHeight:"100vh"}}>
    <header style=${{background:INK,color:"#fff",padding:"18px 24px"}}>
      <div style=${{maxWidth:1180,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:12}}>
        <div>
          <div class="mono" style=${{fontSize:11,letterSpacing:"0.15em",color:"#8FA6D6",textTransform:"uppercase"}}>Gestão de Projetos · Escritório de Engenharia</div>
          <div style=${{fontSize:21,fontWeight:700,marginTop:2}}>Painel de Controle</div>
        </div>
        <div style=${{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
          <nav style=${{display:"flex",gap:6,background:"rgba(255,255,255,0.08)",padding:4,borderRadius:9}}>
            ${TABS.map(t => html`<button key=${t.id} onClick=${()=>setTab(t.id)} style=${{padding:"8px 14px",borderRadius:6,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,background:tab===t.id?"#fff":"transparent",color:tab===t.id?INK:"#C7D2E6"}}>${t.label}</button>`)}
          </nav>
          <span style=${{fontSize:12,color:"#C7D2E6"}}>${email}</span>
          <button class="btn-ghost btn" style=${{background:"transparent",border:"1px solid rgba(255,255,255,0.3)",color:"#C7D2E6"}} onClick=${onLogout}>Sair</button>
        </div>
      </div>
    </header>
    <main style=${{maxWidth:1180,margin:"0 auto",padding:"22px 24px 60px"}}>
      ${error && html`<div style=${{background:TERRA+"15",border:"1px solid "+TERRA+"40",color:TERRA,padding:"10px 14px",borderRadius:8,marginBottom:16,fontSize:13}}>${error}</div>`}
      ${canSeed && html`<div class="card" style=${{padding:16,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
        <div style=${{fontSize:13,color:SLATE}}>A planilha está vazia. Você pode importar os ${SEED_PROJETOS.length} projetos e ${SEED_CLIENTES.length} clientes extraídos da planilha original (uma vez só).</div>
        <button class="btn btn-primary" onClick=${runSeed} disabled=${busy}>${busy?"Importando...":"Importar dados da planilha"}</button>
      </div>`}
      ${!loaded ? html`<div style=${{padding:60,textAlign:"center",color:SLATE}}>Carregando dados...</div>` : html`
        ${tab==="dashboard" && html`<${Dashboard} projetos=${projetos} clientes=${clientes} />`}
        ${tab==="projetos" && html`<${ProjetosTab} projetos=${projetos} clientes=${clientes} busy=${busy} onSave=${upsertProjeto} onDelete=${deleteProjeto} />`}
        ${tab==="clientes" && html`<${ClientesTab} clientes=${clientes} busy=${busy} onSave=${upsertCliente} onDelete=${deleteCliente} />`}
      `}
    </main>
  </div>`;
}

function Root(){
  const [auth, setAuth] = useState(() => { try { return JSON.parse(localStorage.getItem('auth-v1')); } catch(e){ return null; } });
  const [apiReady, setApiReady] = useState(!!localStorage.getItem('apiUrl'));

  if(!auth) return html`<${Login} onSuccess=${email => setAuth({email})} />`;
  if(!apiReady) return html`<${Setup} onSaved=${()=>setApiReady(true)} />`;
  return html`<${AppMain} email=${auth.email} onLogout=${()=>{ localStorage.removeItem('auth-v1'); setAuth(null); }} />`;
}

render(html`<${Root} />`, document.getElementById('root'));
</script>
</body>
</html>
